services:
  - type: web
    name: nemotron-workspace
    env: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: "false"
      - key: EXPERIENTIAL_LABS_API_KEY
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
