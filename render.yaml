services:
  - type: web
    name: nemotron-workspace
    env: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOKENHARBOR_API_KEY
        sync: false
      - key: TOKENHARBOR_FREE_ACCESS_CONFIRMED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_FREE_TIER_CONFIRMED
        value: "false"
      - key: X_BEARER_TOKEN
        sync: false
      - key: X_SEARCH_ENABLED
        value: "false"
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_FREE_TIER_CONFIRMED
        value: "false"
      - key: WEB_FETCH_MAX_BYTES
        value: "20000000"
      - key: EXPERIENTIAL_LABS_API_KEY
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
